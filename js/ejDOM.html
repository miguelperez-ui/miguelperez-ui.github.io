<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios</title>
</head>
<body>
    <div id="titulo">Hola</div>

    <button class="boton1">Hokla</button>


    <script>
        const titulo=document.getElementById("titulo");
        let cabeceras="";
        for(i=1;i<6;i++){
            titulo.innerHTML="<h"+i+">Cabezera H "+i+"</h"+i+">";
        }
        titulo.innerHTML=cabeceras

        const boton = document.querySelector(".boton1");
        boton.style.backgroundColor = "blue";
        boton.style.color = "white";

        document.querySelector(".boton1").addEventListener("click", function(){
        alert("¡Botón presionado!");
        boton.style.color="blue";
        });


    </script>


</body>


</html>
