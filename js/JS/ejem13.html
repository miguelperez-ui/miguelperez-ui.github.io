<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tienda Hardware - Carrito de Compra</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 40px; }
        .card-carrito { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .total-box { background: #212529; color: #00ff00; padding: 20px; border-radius: 10px; font-family: monospace; }
        .badge-iva { font-size: 0.75rem; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container">
    <div class="row">
        <div class="col-md-5">
            <div class="card-carrito border">
                <h4>🛒 Añadir al Carrito</h4>
                <hr>
                <div class="mb-2">
                    <label>Componente:</label>
                    <input type="text" id="componente" class="form-control" placeholder="Ej: Memoria RAM 16GB">
                </div>
                <div class="row mb-2">
                    <div class="col-6">
                        <label>Cantidad:</label>
                        <input type="number" id="cantidad" class="form-control" value="1" min="1">
                    </div>
                    <div class="col-6">
                        <label>Precio Unit. (€):</label>
                        <input type="number" id="precio" class="form-control" placeholder="0.00">
                    </div>
                </div>
                <div class="mb-3">
                    <label>Tipo de IVA:</label>
                    <select id="iva" class="form-select">
                        <option value="21">General (21%)</option>
                        <option value="10">Reducido (10%)</option>
                        <option value="4">Superreducido (4%)</option>
                    </select>
                </div>
                <button id="btnAgregar" class="btn btn-primary w-100 fw-bold">Agregar Producto</button>
            </div>

            <button id="btnFinalizar" class="btn btn-dark w-100 mt-4 py-3 shadow">
                💳 FINALIZAR COMPRA (Enviar)
            </button>
        </div>

        <div class="col-md-7">
            <div class="card-carrito border">
                <h5>Lista de Artículos</h5>
                <table class="table align-middle">
                    <thead>
                    <tr>
                        <th>Cant.</th><th>Producto</th><th>P. Unit</th><th>Total + IVA</th>
                    </tr>
                    </thead>
                    <tbody id="tablaCarrito"></tbody>
                </table>

                <div class="total-box mt-4">
                    <div class="d-flex justify-content-between">
                        <span>Base Imponible:</span>
                        <span><span id="baseImponible">0.00</span>€</span>
                    </div>
                    <div class="d-flex justify-content-between h4 mt-2">
                        <span>TOTAL (INC. IVA):</span>
                        <span><span id="totalFinal">0.00</span>€</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Array para manejar los datos
    let carrito = [];

    // 1. EVENTO AGREGAR PRODUCTO
    $("#btnAgregar").click(function() {
        let nombre = $("#componente").val().trim();
        let cant = parseInt($("#cantidad").val());
        let prec = parseFloat($("#precio").val());
        let ivaPorcentaje = parseInt($("#iva").val());

        // Validación de campos
        if (nombre === "" || isNaN(prec) || prec <= 0) {
            alert("Por favor, introduce un nombre y precio válido.");
            return;
        }

        // VALIDACIÓN: No duplicar productos
        // Buscamos si el nombre ya existe en nuestro array
        let repetido = false;
        for (let i = 0; i < carrito.length; i++) {
            if (carrito[i].nombre.toLowerCase() === nombre.toLowerCase()) {
                repetido = true;
                break;
            }
        }

        if (repetido) {
            alert("Este producto ya está en el carrito. Elimínalo si quieres cambiar la cantidad.");
            return;
        }

        // Cálculo de IVA y Subtotal
        // Conceptualmente: $Total = (Cantidad \times Precio) \times (1 + \frac{IVA}{100})$
        let subtotalBase = cant * prec;
        let precioConIva = subtotalBase * (1 + (ivaPorcentaje / 100));

        // Creamos objeto
        let item = {
            nombre: nombre,
            cantidad: cant,
            precioUnit: prec,
            iva: ivaPorcentaje,
            totalConIva: precioConIva,
            base: subtotalBase
        };

        // Guardamos y pintamos
        carrito.push(item);
        actualizarPantalla();

        // Limpiamos
        $("#componente, #precio").val("");
        $("#cantidad").val(1);
    });

    // 2. ACTUALIZAR INTERFAZ
    function actualizarPantalla() {
        $("#tablaCarrito").empty();
        let acumuladoBase = 0;
        let acumuladoTotal = 0;

        for (let producto of carrito) {
            let fila = `<tr>
                <td>${producto.cantidad}</td>
                <td>${producto.nombre} <span class="badge bg-secondary badge-iva">${producto.iva}% IVA</span></td>
                <td>${producto.precioUnit.toFixed(2)}€</td>
                <td class="fw-bold">${producto.totalConIva.toFixed(2)}€</td>
            </tr>`;

            $("#tablaCarrito").append(fila);

            acumuladoBase += producto.base;
            acumuladoTotal += producto.totalConIva;
        }

        // Actualizar cajas de texto
        $("#baseImponible").text(acumuladoBase.toFixed(2));
        $("#totalFinal").text(acumuladoTotal.toFixed(2));
    }

    // 3. ENVÍO AL SERVIDOR (ECO)
    $("#btnFinalizar").click(function() {
        if (carrito.length === 0) {
            alert("El carrito está vacío.");
            return;
        }

        $.ajax({
            url: "https://lm.iesnervion.es/eco.php",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(carrito),
            success: function(datos) {
                console.log("Servidor Eco respondió:", datos);
                alert("Compra sincronizada correctamente. Vaciando carrito...");

                // Limpieza total tras éxito
                carrito = [];
                actualizarPantalla();
            },
            error: function() {
                alert("Error al enviar los datos. Revisa la consola.");
            }
        });
    });
</script>

</body>
</html>
