<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Interactiva</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
            color: #333;
        }
        .formulario {
            background-color: #f1f1f1;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .campo {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        input {
            padding: 5px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .caja-resultado {
            padding: 15px;
            background-color: #e9ffe9;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none; 
        }
    </style>
</head>
<body>

    <h1>Introduce tus datos</h1>
    
    <div class="formulario">
        <div class="campo">
            <label for="inputNombre">Nombre:</label>
            <input type="text" id="inputNombre"ººº>
        </div>
        <div class="campo">
            <label for="inputEdad">Edad:</label>
            <input type="number" id="inputEdad">
        </div>
        <hr>
        <div class="campo">
            <label for="inputNumA">Número 1:</label>
            <input type="number" id="inputNumA">
        </div>
        <div class="campo">
            <label for="inputNumB">Número 2:</label>
            <input type="number" id="inputNumB">
        </div>
        
        <button onclick="calcular()">Mostrar Resultados</button>
    </div>

    <div id="presentacion" class="caja-resultado"></div>
    <div id="calculos" class="caja-resultado"></div>

    <script>
    
        function calcular() {
            // 1. Leer los valores que el usuario ha escrito en las cajas de texto
            let nombre = document.getElementById("inputNombre").value;
            let edad = document.getElementById("inputEdad").value;
            
            // Usamos Number() para asegurarnos de que el texto se convierte en número para hacer matemáticas
            let numeroA = Number(document.getElementById("inputNumA").value);
            let numeroB = Number(document.getElementById("inputNumB").value);

            // 2. Preparar el mensaje de presentación
            let textoPresentacion = `Mi nombre es ${nombre} y tengo ${edad} años.`;
            
            // Mostrarlo en pantalla y hacer visible la caja
            let cajaPresentacion = document.getElementById("presentacion");
            cajaPresentacion.innerHTML = textoPresentacion;
            cajaPresentacion.style.display = "block"; 

            // 3. Hacer los cálculos
            let suma = numeroA + numeroB;
            let diferencia = numeroA - numeroB;
            let producto = numeroA * numeroB;
            let cociente = numeroA / numeroB;

            // Preparar el mensaje de los cálculos
            let textoCalculos = `
                <strong>Números elegidos:</strong> ${numeroA} y ${numeroB} <br><br>
                <strong>Suma:</strong> ${suma} <br>
                <strong>Diferencia:</strong> ${diferencia} <br>
                <strong>Producto:</strong> ${producto} <br>
                <strong>Cociente:</strong> ${cociente}
            `;

            // Mostrarlo en pantalla y hacer visible la caja
            let cajaCalculos = document.getElementById("calculos");
            cajaCalculos.innerHTML = textoCalculos;
            cajaCalculos.style.display = "block";
        }
    </script>

</body>
</html>
