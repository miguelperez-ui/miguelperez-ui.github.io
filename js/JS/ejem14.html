<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Soporte Técnico - Registro de Incidencias</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fdfdfe; padding: 40px; }
        .prioridad-alta { font-weight: bold; color: #d9534f; } /* Rojo y negrita para incidencias críticas */
        .card-soporte { border-top: 5px solid #6c757d; }
        .stats-badge { font-size: 1rem; padding: 10px; margin-right: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="mb-4">🛠️ Panel de Soporte Técnico (SIAE)</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card card-soporte p-3 shadow-sm">
                <h5>Nueva Incidencia</h5>
                <hr>
                <div class="mb-2">
                    <label>Usuario:</label>
                    <input type="text" id="usuario" class="form-control" placeholder="Nombre del profesor/alumno">
                </div>
                <div class="mb-2">
                    <label>Aula:</label>
                    <input type="text" id="aula" class="form-control" placeholder="Ej: Aula 10 o Biblioteca">
                </div>
                <div class="mb-2">
                    <label>Prioridad:</label>
                    <select id="prioridad" class="form-select">
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Descripción:</label>
                    <textarea id="descripcion" class="form-control" rows="2" placeholder="¿Qué falla?"></textarea>
                </div>
                <button id="btnRegistrar" class="btn btn-secondary w-100">Registrar Incidencia</button>
            </div>

            <button id="btnEnviar" class="btn btn-info w-100 mt-3 text-white fw-bold">
                📤 SINCRONIZAR CON CENTRAL
            </button>
        </div>

        <div class="col-md-8">
            <div class="table-responsive bg-white p-3 border rounded shadow-sm">
                <table class="table align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Aula</th><th>Usuario</th><th>Prioridad</th><th>Acción</th>
                    </tr>
                    </thead>
                    <tbody id="tablaIncidencias">
                    </tbody>
                </table>
            </div>

            <div class="mt-4">
                <h6>Resumen de carga de trabajo:</h6>
                <span class="badge bg-danger stats-badge">Altas: <span id="countAlta">0</span></span>
                <span class="badge bg-warning text-dark stats-badge">Medias: <span id="countMedia">0</span></span>
                <span class="badge bg-success stats-badge">Bajas: <span id="countBaja">0</span></span>
            </div>
        </div>
    </div>
</div>

<script>
    // Nuestro array de incidencias
    let listaIncidencias = [];

    // 1. REGISTRAR INCIDENCIA
    $("#btnRegistrar").click(function() {
        let user = $("#usuario").val().trim();
        let classroom = $("#aula").val().trim();
        let prio = $("#prioridad").val();
        let desc = $("#descripcion").val().trim();

        if (user === "" || classroom === "" || desc === "") {
            alert("Por favor, completa todos los datos de la incidencia.");
            return;
        }

        // Creamos el objeto (añadimos un ID único basado en el tiempo para poder borrar luego)
        let incidencia = {
            id: Date.now(),
            usuario: user,
            aula: classroom,
            prioridad: prio,
            descripcion: desc
        };

        listaIncidencias.push(incidencia);
        actualizarVista();

        // Limpiamos campos
        $("#usuario, #aula, #descripcion").val("");
    });

    // 2. FUNCIÓN PARA PINTAR LA TABLA Y LAS STATS
    function actualizarVista() {
        $("#tablaIncidencias").empty();

        // Contadores
        let altas = 0, medias = 0, bajas = 0;

        for (let inc of listaIncidencias) {
            // Lógica de Negrita para prioridad Alta
            let clasePrio = (inc.prioridad === "Alta") ? "prioridad-alta" : "";

            let fila = `<tr class="${clasePrio}">
                <td>${inc.aula}</td>
                <td>${inc.usuario}</td>
                <td>${inc.prioridad}</td>
                <td>
                    <button class="btn btn-outline-success btn-sm" onclick="solucionar(${inc.id})">
                        ✔ Solucionar
                    </button>
                </td>
            </tr>`;

            $("#tablaIncidencias").append(fila);

            // Contar para las medallas de abajo
            if (inc.prioridad === "Alta") altas++;
            else if (inc.prioridad === "Media") medias++;
            else bajas++;
        }

        // Actualizar los números de los badges
        $("#countAlta").text(altas);
        $("#countMedia").text(medias);
        $("#countBaja").text(bajas);
    }

    // 3. FUNCIÓN PARA SOLUCIONAR (BORRAR) UNA ESPECÍFICA
    function solucionar(idBuscado) {
        // Filtramos el array: nos quedamos con todos MENOS el que tiene ese ID
        listaIncidencias = listaIncidencias.filter(inc => inc.id !== idBuscado);
        actualizarVista();
    }

    // 4. ENVÍO AL SERVIDOR (ECO)
    $("#btnEnviar").click(function() {
        if (listaIncidencias.length === 0) {
            alert("No hay incidencias pendientes que enviar.");
            return;
        }

        $.ajax({
            url: "https://lm.iesnervion.es/eco.php",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(listaIncidencias),
            success: function(res) {
                console.log("Respuesta del servidor:", res);
                alert("Incidencias sincronizadas con la central de soporte.");
            },
            error: function() {
                alert("Error al conectar con el servidor central.");
            }
        });
    });
</script>

</body>
</html>
