<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Concesionario - Gestión de Flota</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; padding: 40px; }
    .historico { color: #d9534f; font-weight: bold; }
    .stats-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>

<div class="container">
  <div class="row">
    <div class="col-md-4">
      <div class="card p-3 shadow-sm">
        <h4>Añadir Vehículo</h4>
        <input type="text" id="marca" class="form-control mb-2" placeholder="Marca (ej: Toyota)">
        <input type="text" id="modelo" class="form-control mb-2" placeholder="Modelo (ej: Corolla)">
        <input type="number" id="anio" class="form-control mb-2" placeholder="Año de fabricación">
        <input type="number" id="precio" class="form-control mb-2" placeholder="Precio (€)">
        <select id="combustible" class="form-select mb-3">
          <option value="Diesel">Diesel</option>
          <option value="Gasolina">Gasolina</option>
          <option value="Eléctrico">Eléctrico</option>
        </select>
        <button id="btnAnadir" class="btn btn-primary w-100">Añadir al Inventario</button>
      </div>

      <button id="btnEnviar" class="btn btn-success w-100 mt-3" disabled>
        🚀 Sincronizar (Mínimo 3)
      </button>
    </div>

    <div class="col-md-8">
      <table class="table table-striped table-hover bg-white">
        <thead class="table-dark">
        <tr>
          <th>Marca</th><th>Modelo</th><th>Año</th><th>Precio</th><th>Tipo</th><th>Notas</th>
        </tr>
        </thead>
        <tbody id="listaCoches"></tbody>
      </table>

      <div class="stats-box">
        <h5>📊 Resumen de Flota</h5>
        <p>Precio Medio: <span id="precioMedio">0</span> €</p>
        <p>Coches Eléctricos: <span id="totalElectricos">0</span></p>
      </div>
    </div>
  </div>
</div>

<script>
  // 1. VARIABLE PARA GUARDAR NUESTROS OBJETOS
  let flota = [];

  // 2. FUNCIÓN PARA AÑADIR COCHE
  $("#btnAnadir").click(function() {
    // Cogemos los valores
    let marca = $("#marca").val();
    let modelo = $("#modelo").val();
    let anio = parseInt($("#anio").val());
    let precio = parseFloat($("#precio").val());
    let combustible = $("#combustible").val();

    // Validación simple
    if (!marca || !modelo || !anio || !precio) {
      alert("Rellena todos los campos, gitanillo.");
      return;
    }

    // Lógica de "Vehículo Histórico" (más de 20 años)
    let anioActual = new Date().getFullYear();
    let esHistorico = (anioActual - anio > 20) ? "SÍ (Histórico)" : "No";

    // Creamos el objeto para nuestra lista
    let nuevoCoche = {
      marca: marca,
      modelo: modelo,
      anio: anio,
      precio: precio,
      combustible: combustible,
      historico: esHistorico
    };

    // Lo guardamos en el array
    flota.push(nuevoCoche);

    // Actualizamos la tabla y las estadísticas
    actualizarInterfaz();

    // Limpiamos el formulario
    $(".form-control").val("");
  });

  // 3. ACTUALIZAR TODO EN PANTALLA
  function actualizarInterfaz() {
    // Limpiamos la tabla antes de volver a pintarla
    $("#listaCoches").empty();

    let sumaPrecios = 0;
    let contadorElectricos = 0;

    // Recorremos la flota para pintar las filas
    for (let coche of flota) {
      let claseEspecial = (coche.historico !== "No") ? "historico" : "";

      let fila = `<tr>
                <td>${coche.marca}</td>
                <td>${coche.modelo}</td>
                <td>${coche.anio}</td>
                <td>${coche.precio} €</td>
                <td>${coche.combustible}</td>
                <td class="${claseEspecial}">${coche.historico}</td>
            </tr>`;

      $("#listaCoches").append(fila);

      // Sumamos para las estadísticas
      sumaPrecios += coche.precio;
      if (coche.combustible === "Eléctrico") contadorElectricos++;
    }

    // Pintamos estadísticas
    let media = (flota.length > 0) ? (sumaPrecios / flota.length).toFixed(2) : 0;
    $("#precioMedio").text(media);
    $("#totalElectricos").text(contadorElectricos);

    // Habilitar botón de envío si hay 3 o más
    if (flota.length >= 3) {
      $("#btnEnviar").prop("disabled", false);
    }
  }

  // 4. ENVÍO AL SERVIDOR (ECO)
  $("#btnEnviar").click(function() {
    // Convertimos el array a JSON (serializar)
    let datosAEnviar = JSON.stringify(flota);

    console.log("Enviando a IES Nervión:", datosAEnviar);

    $.ajax({
      url: "",
      type: "POST",
      contentType: "application/json",
      data: datosAEnviar,
      success: function(respuesta) {
        console.log("Servidor responde (Eco):", respuesta);
        alert("¡Flota sincronizada con éxito! Mira la consola.");
      },
      error: function() {
        alert("Error al conectar. Recuerda validar el certificado SSL si falla.");
      }
    });
  });
</script>

</body>
</html>
