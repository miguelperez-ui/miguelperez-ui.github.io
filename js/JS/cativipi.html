<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: RETO - Formulario</title>
    
  

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <h2>Añadir Datos a la Tabla</h2>

    <div class="formulario">
        <input type="text" id="in-nombre" placeholder="Nombre">
        <input type="text" id="in-apellidos" placeholder="Apellidos">
        <input type="number" id="in-edad" placeholder="Edad">
        <input type="text" id="in-ciudad" placeholder="Ciudad">
        <button id="btn-enviar">Enviar</button>
    </div>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Edad</th>
                <th>Ciudad</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            
            $("#btn-enviar").click(function() {
                
                const nuevosDatos = {
                    nombre: $("#in-nombre").val(),
                    apellidos: $("#in-apellidos").val(),
                    edad: $("#in-edad").val(),
                    ciudad: $("#in-ciudad").val()
                };

                const datosSerializados = JSON.stringify(nuevosDatos);
                const datosRecuperados = JSON.parse(datosSerializados);

                const nuevaFila = `
                    <tr>
                        <td>${datosRecuperados.nombre}</td>
                        <td>${datosRecuperados.apellidos}</td>
                        <td>${datosRecuperados.edad}</td>
                        <td>${datosRecuperados.ciudad}</td>
                    </tr>
                `;

                $("#cuerpo-tabla").append(nuevaFila);

        
                
                // Devolvemos el foco al primer input para ir más rápido
                $("#in-nombre").focus();
            });
            
        });
    </script>
</body>
</html>
