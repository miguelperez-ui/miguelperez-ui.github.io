<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pokédex Básica</title>
    <style>body {
    background-color: #f4f4f4;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 50px;
}

.pokedex {
    text-align: center;
    width: 300px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    margin-top: 20px;
    border: 4px solid #ef5350; /* Rojo Pokémon */
}

#pokeName {
    text-transform: uppercase;
    margin-bottom: 10px;
}

#pokeImg {
    width: 150px;
    height: 150px;
}

.type-badge {
    display: inline-block;
    padding: 5px 12px;
    margin: 5px;
    border-radius: 15px;
    background: #333;
    color: white;
    font-size: 0.8em;
}

.nav-buttons {
    margin-top: 20px;
    display: flex;
    justify-content: space-between;
}

button {
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 5px;
    border: none;
    background-color: #3b4cca; /* Azul Pokémon */
    color: white;
}</style>
</head>
<body>

    <div class="pokedex">
        <h1>Pokédex Pro</h1>
        
        <div class="search-area">
            <input type="text" id="pokeInput" placeholder="Nombre o ID...">
            <button onclick="buscarPokemon()">Buscar</button>
        </div>

        <div id="pokeCard" class="card" style="display: none;">
            <h2 id="pokeName"></h2>
            <img id="pokeImg" src="" alt="Pokemon">
            <div id="pokeTypes"></div>
            
            <div class="nav-buttons">
                <button onclick="navegar(-1)">← Anterior</button>
                <button onclick="navegar(1)">Siguiente →</button>
            </div>
        </div>

        <p id="errorMsg" style="color: red; display: none;">¡Pokémon no encontrado!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
