<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 RETO - Base de Datos</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .formulario { border: 2px solid #333; padding: 20px; width: 300px; border-radius: 8px; }
        .formulario input { width: 90%; display: block; margin-bottom: 10px; padding: 8px; }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table, th, td { border: 1px solid black; padding: 10px; text-align: left; }
        th { background-color: #eee; }

        /* Estilo específico para el error del reto */
        #mensajeError { color: red; font-weight: bold; }

        .btn-enviar { background-color: #007bff; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; width: 100%; }
        .btn-enviar:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="formulario">
    <h3>Nuevo Producto</h3>
    <input type="text" id="descripcion" placeholder="Descripción del producto">
    <input type="number" id="idProveedor" placeholder="ID del Proveedor">
    <input type="number" step="0.01" id="precio" placeholder="Precio (ej: 10.50)">

    <button class="btn-enviar" onclick="enviarDatos()">Enviar a MariaDB</button>
</div>

<!-- El h2 para el error solicitado -->
<h2 id="mensajeError"></h2>

<table id="tablaProductos">
    <thead>
    <tr>
        <th>ID</th>
        <th>Descripción</th>
        <th>ID Proveedor</th>
        <th>Precio</th>
    </tr>
    </thead>
    <tbody id="cuerpoTabla">
    <!-- Aquí se cargarán los datos de la "lista" -->
    </tbody>
</table>

<script>
    async function enviarDatos() {
        const descripcion = document.getElementById("descripcion").value;
        const idProveedor = document.getElementById("idProveedor").value;
        const precio = document.getElementById("precio").value;
        const h2Error = document.getElementById("mensajeError");
        const cuerpoTabla = document.getElementById("cuerpoTabla");

        // 1. Validación básica
        if (!descripcion || !idProveedor || !precio) {
            alert("Por favor, rellena todos los campos.");
            return;
        }

        // 2. Preparar el objeto (id no se envía porque es AUTO_INCREMENT)
        const nuevoProducto = {
            descripcion: descripcion,
            idProveedor: parseInt(idProveedor),
            precio: parseFloat(precio)
        };

        try {
            // 3. Envío al servidor del reto
            const respuesta = await fetch('https://lm.iesnervion.es/reto4.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoProducto)
            });

            if (!respuesta.ok) throw new Error("Error en la conexión");

            const resultado = await respuesta.json();

            // 4. Gestionar el error (h2 en negrita y rojo)
            if (resultado.error === null) {
                h2Error.textContent = "Todo fue OK";
                h2Error.style.color = "green"; // Un extra de claridad
            } else {
                h2Error.textContent = "Error: " + resultado.error;
                h2Error.style.color = "red";
            }

            // 5. Mostrar la lista en la tabla
            renderizarTabla(resultado.lista);

        } catch (error) {
            console.error("Error técnico:", error);
            h2Error.textContent = "Error técnico al conectar con el servidor.";
        }
    }

    function renderizarTabla(lista) {
        const cuerpo = document.getElementById("cuerpoTabla");
        cuerpo.innerHTML = ""; // Limpiamos lo anterior

        if (!lista || lista.length === 0) return;

        lista.forEach(prod => {
            const fila = document.createElement("tr");

            // Creamos las celdas basadas en las columnas de la BD
            fila.innerHTML = `
                <td>${prod.id}</td>
                <td>${prod.descripcion}</td>
                <td>${prod.idProveedor}</td>
                <td>${prod.precio} €</td>
            `;

            cuerpo.appendChild(fila);
        });
    }
</script>
</body>
</html>
