<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Actividades</title>
    <style>
        /* Estilos generales de la página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 40px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }

        /* Contenedor tipo cuadrícula para los enlaces */
        .contenedor-actividades {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* Estilos para cada tarjeta/enlace */
        .actividad-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none; /* Quita el subrayado del enlace */
            color: inherit; /* Mantiene el color del texto normal */
            border-left: 5px solid #3498db;
        }

        /* Efecto al pasar el ratón por encima */
        .actividad-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-left-color: #2980b9;
        }

        .actividad-titulo {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .actividad-desc {
            font-size: 0.95em;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>Índice de Mis Actividades</h1>

    <div class="contenedor-actividades">
        
        <!-- Tarjeta de Actividad 1 -->
        <a href="ruta_a_tu_actividad_1.html" class="actividad-card">
            <div class="actividad-titulo">Actividad 1: Conceptos Básicos</div>
            <div class="actividad-desc">Descripción de la primera actividad que realizaste.</div>
        </a>

        <!-- Tarjeta de Actividad 2 -->
        <a href="ruta_a_tu_actividad_2.html" class="actividad-card">
            <div class="actividad-titulo">Actividad 2: Estilos CSS</div>
            <div class="actividad-desc">Pruebas de diseño y estructuración visual.</div>
        </a>

        <!-- Tarjeta de Actividad 3 (La que acabamos de hacer) -->
        <a href="ej3.html" class="actividad-card">
            <div class="actividad-titulo">Ejercicio 3: Formularios y jQuery</div>
            <div class="actividad-desc">Tabla interactiva que lee datos de un formulario y checkboxes calculando estadísticas.</div>
        </a>

        <!-- Puedes copiar y pegar el bloque de arriba para añadir más actividades -->

    </div>

</body>
</html>
