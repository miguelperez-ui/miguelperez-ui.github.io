<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 - Geolocalizador de IP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f2f5; padding-top: 50px; }
    .main-card { max-width: 800px; margin: auto; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    #mapaContenedor { width: 100%; height: 400px; border-radius: 10px; overflow: hidden; display: none; margin-top: 20px; border: 1px solid #ddd; }
    #infoIP { display: none; }
    .data-label { font-weight: bold; color: #555; }
  </style>
</head>
<body>

<div class="container">
  <div class="card main-card p-4">
    <h2 class="text-center mb-4">🌍 Geolocalizador de IP</h2>

    <div class="input-group mb-3">
      <input type="text" id="ipInput" class="form-control" placeholder="Introduce una IP (ej: 8.8.8.8)" aria-label="Dirección IP">
      <button class="btn btn-primary" onclick="buscarIP()">Buscar Localización</button>
    </div>

    <div id="loader" class="text-center my-3" style="display: none;">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div id="infoIP" class="row mt-4">
      <div class="col-md-5">
        <h4 class="border-bottom pb-2">Información Técnica</h4>
        <ul class="list-unstyled">
          <li><span class="data-label">País:</span> <span id="txtPais"></span></li>
          <li><span class="data-label">Ciudad:</span> <span id="txtCiudad"></span></li>
          <li><span class="data-label">Región:</span> <span id="txtRegion"></span></li>
          <li><span class="data-label">Código Postal:</span> <span id="txtCP"></span></li>
          <li><span class="data-label">Proveedor (ISP):</span> <span id="txtISP"></span></li>
          <li><span class="data-label">Coordenadas:</span> <span id="txtCoords"></span></li>
        </ul>
      </div>
      <div class="col-md-7">
        <div id="mapaContenedor">
          <iframe id="googleMap" width="100%" height="100%" frameborder="0" scrolling="no" marginheight="0" marginwidth="0" src=""></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  async function buscarIP() {
    const ip = document.getElementById('ipInput').value.trim();
    const loader = document.getElementById('loader');
    const infoIP = document.getElementById('infoIP');
    const mapaContenedor = document.getElementById('mapaContenedor');

    if (!ip) {
      alert("Por favor, introduce una dirección IP válida.");
      return;
    }

    loader.style.display = 'block';
    infoIP.style.display = 'none';

    try {
      // Llamada a la API (Nota: http://ip-api.com no soporta HTTPS en su versión gratuita)
      const respuesta = await fetch(`http://ip-api.com/json/${ip}`);
      const datos = await respuesta.json();

      if (datos.status === "fail") {
        alert("No se ha podido localizar esa IP. Revisa el formato.");
        return;
      }

      // 1. Requisito Base: Abrir en nueva pestaña
      const urlMaps = `https://www.google.com/maps?q=${datos.lat},${datos.lon}&z=15`;
      window.open(urlMaps, '_blank');

      // 2. RETO: Embeber mapa y mostrar info sin recargar
      document.getElementById('txtPais').textContent = datos.country;
      document.getElementById('txtCiudad').textContent = datos.city;
      document.getElementById('txtRegion').textContent = datos.regionName;
      document.getElementById('txtCP').textContent = datos.zip;
      document.getElementById('txtISP').textContent = datos.isp;
      document.getElementById('txtCoords').textContent = `${datos.lat}, ${datos.lon}`;

      // Actualizar el iframe de Google Maps para el embebido
      const embedUrl = `https://maps.google.com/maps?q=${datos.lat},${datos.lon}&z=14&output=embed`;
      document.getElementById('googleMap').src = embedUrl;

      // Mostrar resultados
      infoIP.style.display = 'flex';
      mapaContenedor.style.display = 'block';

    } catch (error) {
      console.error("Error:", error);
      alert("Error al conectar con la API de geolocalización.");
    } finally {
      loader.style.display = 'none';
    }
  }
</script>

</body>
</html>
