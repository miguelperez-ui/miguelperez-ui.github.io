<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 6 - Chuck Norris Jokes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #2b1d0e; color: #f4f4f4; font-family: 'Segoe UI', sans-serif; }
    .joke-card {
      background: #3d2b1f;
      border-left: 8px solid #f39c12;
      border-radius: 10px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      margin-top: 30px;
    }
    .main-joke { font-size: 1.8rem; font-weight: bold; line-height: 1.4; color: #f39c12; }
    .history-section { background: rgba(0,0,0,0.2); border-radius: 10px; padding: 20px; margin-top: 40px; }
    .history-item {
      border-bottom: 1px solid #555;
      padding: 10px 0;
      font-size: 0.95rem;
      color: #ccc;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .btn-chuck { background-color: #f39c12; border: none; font-weight: bold; color: #2b1d0e; }
    .btn-chuck:hover { background-color: #e67e22; color: white; }
  </style>
</head>
<body>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 text-center">
      <h1 class="display-4 fw-bold mb-4">🤠 Chuck Norris Fact Generator</h1>

      <div class="d-flex gap-2 justify-content-center mb-4">
        <select id="catSelector" class="form-select w-50" style="background: #eee;">
          <option value="" selected disabled>Cargando categorías...</option>
        </select>
        <button id="btnJoke" class="btn btn-chuck px-4">¡Cuéntame uno!</button>
      </div>

      <div id="jokeDisplay" class="joke-card" style="display: none;">
        <p id="txtJoke" class="main-joke"></p>
        <small class="text-uppercase tracking-widest opacity-50">Chuck Norris Facts</small>
      </div>

      <div class="history-section text-start">
        <h5 class="text-uppercase border-bottom border-warning pb-2 mb-3" style="color: #f39c12;">Últimos chistes</h5>
        <div id="historyList">
          <p class="text-muted italic">Aún no has generado ningún chiste...</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const selector = document.getElementById('catSelector');
  const btn = document.getElementById('btnJoke');
  const txtJoke = document.getElementById('txtJoke');
  const jokeDisplay = document.getElementById('jokeDisplay');
  const historyList = document.getElementById('historyList');

  let historialChistes = [];

  // 1. Cargar categorías al iniciar la página
  async function cargarCategorias() {
    try {
      const res = await fetch('https://api.chucknorris.io/jokes/categories');
      const categorias = await res.json();

      selector.innerHTML = '<option value="" selected disabled>Elige una categoría</option>';
      categorias.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        selector.appendChild(opt);
      });
    } catch (error) {
      selector.innerHTML = '<option disabled>Error al cargar</option>';
    }
  }

  // 2. Obtener un chiste aleatorio de la categoría elegida
  async function obtenerChiste() {
    const cat = selector.value;
    if (!cat) {
      alert("Selecciona una categoría primero, ¡o Chuck se enfadará!");
      return;
    }

    try {
      btn.disabled = true;
      btn.textContent = "Buscando...";

      const res = await fetch(`https://api.chucknorris.io/jokes/random?category=${cat}`);
      const data = await res.json();

      // Mostrar el chiste principal
      txtJoke.textContent = `"${data.value}"`;
      jokeDisplay.style.display = 'block';

      // Actualizar el historial (RETO)
      actualizarHistorial(data.value);

    } catch (error) {
      alert("No hemos podido contactar con Chuck. Seguramente está ocupado contando hasta el infinito... por segunda vez.");
    } finally {
      btn.disabled = false;
      btn.textContent = "¡Cuéntame uno!";
    }
  }

  // 3. Lógica del Reto: Historial limitado a 5
  function actualizarHistorial(nuevoChiste) {
    // Añadir al principio del array
    historialChistes.unshift(nuevoChiste);

    // Limitar a los últimos 5
    if (historialChistes.length > 5) {
      historialChistes.pop();
    }

    // Renderizar la lista
    historyList.innerHTML = "";
    historialChistes.forEach(chiste => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.textContent = chiste;
      historyList.appendChild(div);
    });
  }

  // Eventos
  btn.addEventListener('click', obtenerChiste);
  window.onload = cargarCategorias;
</script>

</body>
</html>
